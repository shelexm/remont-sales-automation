[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remont-sales-automation"
version = "0.2.0"
description = "Демонстрационная автоматизация заявок ремонтной компании"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.2.13",
    "SQLAlchemy==2.0.44",
    "alembic==1.20.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
