worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 8443 ssl;
        server_name crm.remont.internal;
        ssl_certificate /run/tls/crm.crt;
        ssl_certificate_key /run/tls/crm.key;
        location / {
            proxy_pass http://remont-local-crm-crm-1:80;
            proxy_set_header Host localhost:18090;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
