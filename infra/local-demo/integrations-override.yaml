services:
  integrations:
    environment:
      CRM_PROVIDER: espocrm
      ESPO_URL: https://crm.remont.internal:8443
      ESPO_API_KEY: ${LOCAL_ESPO_API_KEY:?}
      ESPO_ASSIGNED_USER_ID: ${LOCAL_ESPO_OWNER:?}
      SSL_CERT_FILE: /run/tls/ca.crt
      SSL_CERT_DIR: /etc/ssl/certs
    volumes:
      - ./infra/local-demo/.local/ca.crt:/run/tls/ca.crt:ro
