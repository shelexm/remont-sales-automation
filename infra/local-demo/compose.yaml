name: remont-local-automation
services:
  crm-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local/crm.crt:/run/tls/crm.crt:ro
      - ./.local/crm.key:/run/tls/crm.key:ro
    networks:
      automation:
        aliases: [crm.remont.internal]
      crm: {}
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_LOG_LEVEL: warn
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [automation]
    restart: unless-stopped
volumes:
  n8n-data:
networks:
  automation:
    external: true
    name: remont-trial_default
  crm:
    external: true
    name: remont-local-crm_default
