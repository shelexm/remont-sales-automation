name: remont-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: remont
      POSTGRES_USER: remont
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - remont-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remont -d remont"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://remont:${POSTGRES_PASSWORD}@db:5432/remont
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  receiver:
    build: .
    environment:
      DATABASE_URL: postgresql://remont:${POSTGRES_PASSWORD}@db:5432/remont
      WEBHOOK_KEY: ${WEBHOOK_KEY:?Set WEBHOOK_KEY}
      HIGH_BUDGET_THRESHOLD: ${HIGH_BUDGET_THRESHOLD:-1000000}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  integrations:
    build: .
    command: ["python", "-u", "-m", "app.integrations.worker"]
    environment:
      DATABASE_URL: postgresql://remont:${POSTGRES_PASSWORD}@db:5432/remont
      CRM_PROVIDER: ${CRM_PROVIDER:-demo}
      ESPO_URL: ${ESPO_URL:-}
      ESPO_API_KEY: ${ESPO_API_KEY:-}
      ESPO_ASSIGNED_USER_ID: ${ESPO_ASSIGNED_USER_ID:-}
      ESPO_UNPROCESSED_STAGE: ${ESPO_UNPROCESSED_STAGE:-Prospecting}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FOLLOWUP_MINUTES: ${FOLLOWUP_MINUTES:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  remont-db:
