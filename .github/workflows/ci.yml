name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.13 pip-audit==2.9.0 .
      - run: ruff check tests app migrations infra/local-demo infra/backup
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tests app migrations infra/local-demo infra/backup
      - run: python -m json.tool workflows/process-leads.json > /dev/null
      - name: Validate local demo Compose configuration
        run: |
          docker compose --env-file .env.example --profile monitor config --quiet
          docker compose --env-file infra/local-demo/env.example -f infra/local-demo/crm-compose.yaml config --quiet
          docker compose --env-file infra/local-demo/env.example -f infra/local-demo/compose.yaml config --quiet
          docker compose -p remont-trial --env-file .env.example --env-file infra/local-demo/env.example -f compose.yaml -f infra/local-demo/integrations-override.yaml config --quiet
          docker compose -p remont-trial --env-file .env.example --env-file infra/local-demo/env.example -f compose.yaml -f infra/local-demo/integrations-override.yaml -f infra/local-demo/telegram-override.yaml config --quiet
          docker compose -p remont-trial --env-file .env.example --env-file infra/local-demo/env.example -f compose.yaml -f infra/local-demo/integrations-override.yaml -f infra/local-demo/telegram-override.yaml --profile monitor config --quiet
      - name: Exercise n8n against disposable PostgreSQL
        run: python tests/n8n_smoke.py
      - name: Verify isolated PostgreSQL backup and restore
        run: python tests/backup_smoke.py
      - name: Verify isolated MariaDB backup and restore
        run: python tests/backup_mariadb_smoke.py
      - name: Verify online n8n SQLite snapshot
        run: python tests/backup_n8n_smoke.py
      - name: Verify isolated n8n restore and key
        run: python tests/n8n_restore_smoke.py
      - name: Verify isolated EspoCRM file archive
        run: python tests/backup_espo_files_smoke.py
      - name: Verify receiver readiness and recovery
        run: python tests/readiness_smoke.py
      - name: Audit Python tooling dependencies
        run: python -m pip_audit
      - name: Check tracked files for private keys
        run: |
          marker="$(printf '%s%s' '-----BEGIN ' '(RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----')"
          if git grep -n -I -E -- "$marker"; then
            exit 1
          fi
      - name: Scan tracked content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
