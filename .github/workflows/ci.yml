name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.13 pip-audit==2.9.0 -r services/lead_ingest/requirements.txt
      - run: ruff check tests services/lead_ingest
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tests services/lead_ingest
      - run: python -m json.tool workflows/process-leads.json > /dev/null
      - name: Exercise n8n against disposable PostgreSQL
        run: python tests/n8n_smoke.py
      - name: Audit Python tooling dependencies
        run: python -m pip_audit
      - name: Check tracked files for private keys
        run: |
          marker="$(printf '%s%s' '-----BEGIN ' '(RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----')"
          if git grep -n -I -E -- "$marker"; then
            exit 1
          fi
      - name: Scan tracked content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
